<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="blackjack.css" rel="stylesheet">
    <title>Number Blackjack Game</title>
</head>
<body>
    <div id="playArea"> 
        <h1>Number Blackjack Game</h1>
        <h3 id="report">Want to play a round?</h3>
        <p id="Cards">Cards: </p>
        <p id="Sum">Sum:</p>
        <div id="btn">
            <button onclick="start()" id="firstButton">START GAME</button>
            <button onclick="newCard()" id="secondButton">NEW CARD</button>
        </div>
    </div>
    <div >
        <h5 id="gameStatus">Game Status: </h5>
    </div>

    <script src="blackjack.js"></script>
</body>
</html>
